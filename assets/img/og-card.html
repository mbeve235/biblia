<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden;
    background: linear-gradient(135deg, #6d4df6 0%, #9c6bff 100%);
    font-family: 'Segoe UI', system-ui, sans-serif; color: #fff;
    display: flex; align-items: center; justify-content: center; gap: 60px; }
  .logo { width: 232px; height: 232px; border-radius: 52px; background: rgba(255,255,255,.16);
    display: grid; place-items: center; flex: none;
    box-shadow: 0 24px 60px rgba(20,10,60,.35); }
  .col h1 { font-size: 96px; font-weight: 800; letter-spacing: -1.5px; line-height: 1; }
  .col p { font-size: 34px; font-weight: 400; color: rgba(255,255,255,.88); margin-top: 18px; }
  .pills { display: flex; gap: 14px; margin-top: 36px; flex-wrap: wrap; max-width: 640px; }
  .pill { font-size: 23px; font-weight: 600; border: 2px solid rgba(255,255,255,.5);
    border-radius: 999px; padding: .4rem 1.25rem; }
</style>
</head>
<body>
  <div class="logo">
    <svg width="150" height="150" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#fff"/>
      <path d="M32 20c-4-3.4-9.6-4.6-15-4.6v29c5.4 0 11 1.2 15 4.6 4-3.4 9.6-4.6 15-4.6v-29c-5.4 0-11 1.2-15 4.6z" fill="#6d4df6"/>
      <path d="M32 20v29" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M22.5 27h7M26 23.5v12" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M37 27h7M37 32h7M37 37h4.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="col">
    <h1>Bíblia Web</h1>
    <p>Leia, pesquise e compare traduções</p>
    <div class="pills">
      <span class="pill">66 livros</span>
      <span class="pill">Favoritos</span>
      <span class="pill">Notas</span>
      <span class="pill">Modo leitura</span>
    </div>
  </div>
</body>
</html>
